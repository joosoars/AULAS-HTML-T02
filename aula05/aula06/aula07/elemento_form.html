<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elemento formulario</title>
</head>
<body>

    <h3>Cadastro de alunos</h3>
    <form action="#">

        <label for="nome_usuario">Nome:</label>
        <input type="text" name="name_user" id="nome_usuario">
        <br><br>

        <label for="">Telefone</label>
        <input type="number" name="telefone" id="contato">
        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" name="email_usuario" id="email">
        <br><br>

       <!--<label for="senha">Senha:</label>
        <input type="password" name="senha" id="senha">-->

       <label for="idade">Informe sua data de nascimento:</label>
        <input type="date" name="data" id="idade">
        <br><br> 
        <h4>Informaçoes do curso</h4>


        <label for="">Indicação do Caps</label>
        <br><br>
        <input type="radio" name="caps" id="sim">
        <label for="sim">Sim</label>
        <br><br>
        <input type="radio" name="caps" id="não">
        <label for="naõ">Não</label>
        <br><br>

        <p>Qual o turno:</p>

        <input type="checkbox" name="turno1" id="manha">
        <label for="">Manhã</label>
        <input type="checkbox" name="turno2" id="tarde">
        <label for="">Tarde</label>
        <input type="checkbox" name="turno3" id="noite">
        <label for="">Noite</label>
        <br><br>

        <label for="localidade">Unidade do ios</label>
        <select name="" id="localidade">
            <option value="sao_leopoldo">São Leopoldo</option>
            <option value="centro">Centro</option>
            <option value="viamao">Viamão</option>
            <option value="tramandai">Tramandaí</option>
            <select name="" id="" disabled="disabled">unidade</select>
            
        </select>

        <br><br>

        <input type="range" name="" id="">
        <br><br>

        <label for="feedbeek">Deixe aqui sua sugestão</label><br>
        <textarea name="feedbeek" id=" feedbeek">feedbeek></textarea>

        <input type="submit" value="Salvar">
    

    </form>

</body>

</html>
